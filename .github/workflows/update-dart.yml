name: DART Financial Update
on:
  schedule:
    - cron: '0 16 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dart-financial-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch DART data and build datasets
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_agent.py
      - name: Publish updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ dashboard/
          if git diff --cached --quiet; then
            echo 'No data/dashboard changes.'
          else
            git commit -m 'chore: update DART financial data'
            git push
          fi
